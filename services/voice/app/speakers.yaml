# Registre des enceintes multi-room.
# kind ∈ { browser, mqtt, snapcast, homeassistant }
# default: une seule des enceintes peut avoir default=true (utilisée si
# aucune présence détectée)

speakers:
  - id: browser_main
    name: Navigateur principal (UI Jarvis)
    room: any
    kind: browser
    default: true

