# Stack observabilité optionnelle.
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Apporte :
# - Prometheus : scrape les métriques /metrics de chaque service
# - Grafana    : dashboards pré-configurés
# - Loki       : agrégation des logs Docker
# - Promtail   : ship des logs locaux vers Loki
# - cAdvisor   : métriques par container
# - Node Exporter : métriques host

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: jarvis-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [jarvis-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.rule=Host(`prometheus.${JARVIS_DOMAIN:-jarvis.local}`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls=true
      - traefik.http.services.prometheus.loadbalancer.server.port=9090

  grafana:
    image: grafana/grafana:11.3.0
    container_name: jarvis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [jarvis-net]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${JARVIS_DOMAIN:-jarvis.local}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  loki:
    image: grafana/loki:3.2.0
    container_name: jarvis-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks: [jarvis-net]

  promtail:
    image: grafana/promtail:3.2.0
    container_name: jarvis-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [jarvis-net]
    depends_on: [loki]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: jarvis-cadvisor
    restart: unless-stopped
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [jarvis-net]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: jarvis-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks: [jarvis-net]

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
