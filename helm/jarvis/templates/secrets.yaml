apiVersion: v1
kind: Secret
metadata:
  name: jarvis-secrets
  labels: {{- include "jarvis.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  MQTT_PASSWORD: {{ .Values.secrets.mqttPassword | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  MISTRAL_API_KEY: {{ .Values.secrets.mistralApiKey | quote }}
  ELEVENLABS_API_KEY: {{ .Values.secrets.elevenlabsApiKey | quote }}
  HA_LONG_LIVED_TOKEN: {{ .Values.secrets.haLongLivedToken | quote }}
  ARGUS_API_TOKEN: {{ .Values.secrets.argusApiToken | quote }}
  VAPID_PUBLIC_KEY: {{ .Values.secrets.vapidPublicKey | quote }}
  VAPID_PRIVATE_KEY: {{ .Values.secrets.vapidPrivateKey | quote }}
