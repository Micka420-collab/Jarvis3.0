# EXEMPLE — à remplacer par sealed-secrets ou external-secrets en prod.
# Généré à la main :
#   kubectl create secret generic jarvis-secrets \
#     --from-literal=JWT_SECRET=... --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=ANTHROPIC_API_KEY=... --from-literal=ARGUS_API_TOKEN=... \
#     -n jarvis --dry-run=client -o yaml > k8s/base/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: jarvis-secrets
  namespace: jarvis
type: Opaque
stringData:
  JWT_SECRET: change_me_long_random
  POSTGRES_PASSWORD: change_me
  ANTHROPIC_API_KEY: ""
  MISTRAL_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  HA_LONG_LIVED_TOKEN: ""
  ARGUS_API_TOKEN: ""
  MQTT_PASSWORD: change_me
