# Tous les microservices applicatifs (gateway, voice, llm, orchestrator, memory,
# iot, security, vision, frontend) suivent le même pattern : Deployment +
# Service ClusterIP. Ils tirent leur env via configmap+secret.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: jarvis, labels: { app: gateway } }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/micka420-collab/jarvis-gateway:latest
          envFrom:
            - configMapRef: { name: jarvis-config }
            - secretRef:    { name: jarvis-secrets }
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: jarvis }
spec:
  selector: { app: gateway }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: voice, namespace: jarvis, labels: { app: voice } }
spec:
  replicas: 1
  selector: { matchLabels: { app: voice } }
  template:
    metadata: { labels: { app: voice } }
    spec:
      containers:
        - name: voice
          image: ghcr.io/micka420-collab/jarvis-voice:latest
          envFrom:
            - configMapRef: { name: jarvis-config }
            - secretRef:    { name: jarvis-secrets }
          volumeMounts: [{ name: models, mountPath: /models }]
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: models }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: models, namespace: jarvis }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
