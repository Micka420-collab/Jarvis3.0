apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: jarvis
data:
  init.sql: |
    -- Charge le schéma au démarrage. Se synchronise avec infra/postgres/init.sql
    -- via kustomize (configMapGenerator) si besoin.
    CREATE EXTENSION IF NOT EXISTS vector;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: jarvis
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          envFrom:
            - configMapRef: { name: jarvis-config }
            - secretRef:    { name: jarvis-secrets }
          env:
            - { name: POSTGRES_DB,       valueFrom: { configMapKeyRef: { name: jarvis-config, key: POSTGRES_DB } } }
            - { name: POSTGRES_USER,     valueFrom: { configMapKeyRef: { name: jarvis-config, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef:    { name: jarvis-secrets, key: POSTGRES_PASSWORD } } }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "jarvis", "-d", "jarvis"] }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: jarvis
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
