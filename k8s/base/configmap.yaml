apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-config
  namespace: jarvis
data:
  JARVIS_DOMAIN: "jarvis.local"
  OWNER_USERNAME: "mickael"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "jarvis"
  POSTGRES_USER: "jarvis"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  QDRANT_COLLECTION: "conversations"
  MQTT_HOST: "mosquitto"
  MQTT_PORT: "1883"
  MQTT_USERNAME: "jarvis"
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "llama3.1:8b"
  OLLAMA_HOST: "http://ollama:11434"
  ANTHROPIC_MODEL: "claude-sonnet-4-6"
  MISTRAL_MODEL: "mistral-large-latest"
  TTS_PROVIDER: "piper"
  PIPER_VOICE: "fr_FR-siwis-medium"
  WHISPER_MODEL: "small"
  WHISPER_LANG: "fr"
  WHISPER_DEVICE: "cpu"
  WHISPER_COMPUTE_TYPE: "int8"
  STT_PARTIAL_EVERY_MS: "700"
  VOICEPRINT_THRESHOLD_ACCEPT: "0.75"
  VOICEPRINT_THRESHOLD_GREY: "0.65"
  VOICEPRINT_CHALLENGE_ENABLED: "true"
  ADMIN_COMMAND_COOLDOWN_SECONDS: "30"
  LIVENESS_THRESHOLD: "0.5"
  AASIST_MODEL_PATH: "/models/aasist/aasist.onnx"
  HA_BASE_URL: "http://homeassistant.home.svc.cluster.local:8123"
  ARGUS_WS_URL: "wss://argus.argus.svc.cluster.local/ws/alerts"
  FRIGATE_WS_URL: "ws://frigate:5000/ws"
  FRIGATE_API_URL: "http://frigate:5000"
  FACE_THRESHOLD: "0.45"
  KNOWN_FACES_DIR: "/models/known_faces"
  Z2M_BASE_TOPIC: "zigbee2mqtt"
  Z2M_FRONTEND_URL: "http://zigbee2mqtt:8080"
  ARDUINO_SERIAL_PORTS: "/dev/ttyUSB0"
  ARDUINO_BAUDRATE: "115200"
  WAKE_WORD: "jarvis"
  WAKE_WORD_THRESHOLD: "0.6"
